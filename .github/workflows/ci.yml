name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --no-build-isolation -e ./llmfetcher
          python -m pip install --no-build-isolation -e '.[test]'

      - name: Run tests
        run: |
          python -m pytest tests -v

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source
        run: |
          python -m compileall -q angelus/ tests/

  build:
    runs-on: ubuntu-latest
    needs: [test, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/angelus-wheel-check
          # llmfetcher is a submodule, not on PyPI: install it locally so the
          # wheel's llmfetcher==0.4.0 requirement resolves without hitting PyPI.
          /tmp/angelus-wheel-check/bin/python -m pip install ./llmfetcher
          /tmp/angelus-wheel-check/bin/python -m pip install --no-build-isolation dist/*.whl
          /tmp/angelus-wheel-check/bin/python -c "import angelus; print('Angelus imported successfully')"

  desktop-build:
    name: Desktop build check
    runs-on: ubuntu-24.04
    needs: [test, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --no-build-isolation -e ./llmfetcher
          python -m pip install --no-build-isolation -e ".[test]"
          python -m pip install -r requirements-desktop.txt
          npm ci

      - name: Build Linux desktop packages
        run: npm run build -- --bundles deb,rpm

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: angelus-linux-packages
          path: src-tauri/target/release/bundle/{deb,rpm}/*
          if-no-files-found: error
