name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Run tests
      run: |
        python -m unittest discover -s tests -v

  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Compile source
      run: |
        python -m compileall -q .

  build:
    runs-on: ubuntu-latest
    needs: [test, checks]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        python -m pip install twine
        twine check dist/*

    - name: Verify wheel installation
      run: |
        python -m venv /tmp/llmfetcher-wheel-check
        /tmp/llmfetcher-wheel-check/bin/python -m pip install --no-deps dist/*.whl
        /tmp/llmfetcher-wheel-check/bin/python -c "import llmfetcher; from llmfetcher.swarm_module import ExecutionGraph; assert 'Current agents:' in str(ExecutionGraph())"
