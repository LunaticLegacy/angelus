<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Angelus · External Agent Hub</title>
    <link rel="stylesheet" href="/static/app.css?v=external-agent-hub-4" />
  </head>
  <body class="external-hub-page">
    <main class="external-hub">
      <header class="external-hub-header"><div><p class="eyebrow">EXTERNAL AGENTS</p><h1>External Agent Hub</h1><p>连接、发现和控制 Codex、Claude Code 与 OpenCode 会话。</p></div><a class="external-hub-back" href="/">返回工作台</a></header>
      <p id="hub-feedback" class="external-hub-feedback" aria-live="polite"></p>
      <section aria-labelledby="provider-heading"><div class="external-section-heading"><div><p class="eyebrow">PROVIDERS</p><h2 id="provider-heading">Provider 连接</h2></div><div class="external-actions"><button id="auto-detect-providers" type="button">自动检测</button><button id="refresh-providers" type="button">刷新</button></div></div><div id="provider-list" class="external-provider-grid"><p class="empty">正在读取 Provider…</p></div></section>
      <section id="provider-detail" class="external-detail" hidden aria-labelledby="provider-detail-title"><div class="external-section-heading"><div><p class="eyebrow">CONNECTION</p><h2 id="provider-detail-title">Provider 设置</h2></div><span id="provider-runtime-state" class="external-state"></span></div><form id="provider-form" class="external-form"><label>当前 Provider<input id="provider-label" readonly /></label><label id="provider-endpoint-row" hidden>OpenCode loopback URL<input id="provider-endpoint" inputmode="url" placeholder="http://127.0.0.1:4096" /></label><p id="provider-help" class="external-help"></p><p id="provider-settings-note" class="external-help" hidden></p><div class="external-actions"><button id="probe-provider" type="button">探测运行时</button><button id="save-provider" type="submit" hidden>保存设置</button><button id="discover-sessions" type="button">发现会话</button></div></form></section>
      <section aria-labelledby="sessions-heading"><div class="external-section-heading"><div><p class="eyebrow">SESSIONS</p><h2 id="sessions-heading">外部会话</h2></div><span id="session-count" class="external-muted"></span></div><div id="external-session-list" class="external-session-list"><p class="empty">选择 Provider 后发现会话。</p></div></section>
      <section id="link-detail" class="external-detail" hidden aria-labelledby="link-title"><div class="external-section-heading"><div><p class="eyebrow">CONTROL</p><h2 id="link-title">已连接会话</h2><p id="link-subtitle" class="external-muted"></p></div><div><span id="lease-state" class="external-state"></span><button id="release-link" type="button">断开控制</button></div></div><div id="link-capabilities" class="external-capabilities"></div><label>消息或 steer 指令<textarea id="link-message" rows="3" placeholder="输入消息；未取得控制 lease 时不会发送。"></textarea></label><div id="link-actions" class="external-actions"></div><pre id="link-result" class="external-result" hidden></pre></section>
      <p class="external-security-note">会话正文、工具参数或 archive 可能含敏感用户内容。浏览器不接收 Provider token、CLI 参数或厂商私有存储内容。</p>
    </main>
    <script type="module" src="/static/external-agents.js?v=external-agent-hub-4"></script>
  </body>
</html>
