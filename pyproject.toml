[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfetcher"
version = "0.4.0"
description = "Multi-agent LLM orchestration framework"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    {name = "LunaticLegacy"},
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.100.0",
    "litellm>=1.0.0",
    "markdown-it-py",
]

[project.scripts]
llmfetcher = "llmfetcher.cli:main"

[tool.setuptools]
package-dir = {llmfetcher = "."}
packages = [
    "llmfetcher",
    "llmfetcher.context_handlers",
    "llmfetcher.fetcher_handlers",
    "llmfetcher.memory",
    "llmfetcher.rag_module",
    "llmfetcher.rag_module.knowledge",
    "llmfetcher.swarm_module",
    "llmfetcher.tools",
]
