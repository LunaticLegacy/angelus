[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "angelus"
version = "0.5.0rc0"
description = "Local observable Agent control plane built on LLMFetcher"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "llmfetcher==0.4.0",
    "markdown-it-py",
    "mcp>=2,<3",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
angelus = "angelus.cli:main"
angelus-web = "angelus.cli:main"

[tool.setuptools.packages.find]
include = ["angelus*"]
